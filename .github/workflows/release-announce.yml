name: Announce release on Discord

# Fires whenever a release is published here — whether it came from the
# desktop-release workflow or a hand push — and posts a download embed to
# Discord. Needs the DISCORD_WEBHOOK_URL repository secret (a channel webhook
# URL, no /github suffix). Without the secret the step no-ops and stays green.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  announce:
    name: Post download embed
    runs-on: ubuntu-latest
    steps:
      - uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          nodetail: true
          title: 'Squidify Desktop ${{ github.event.release.tag_name }} is out'
          description: |
            Grab it from the [releases page](${{ github.event.release.html_url }}): Linux (AppImage, Flatpak), Windows (setup, MSI) and macOS (x64, arm64).
          color: 0xffffff
          username: GitHub
